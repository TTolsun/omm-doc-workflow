version: 2
site:
  root: docs
  content_dir: _content
  inputs_dir: _inputs
sources:
  request-flow:
    kind: omm
    diagram_type: flow
    evidence:
      - "RequestQueue.h"
      - "RequestQueue.cpp"
  session-structure:
    kind: omm
    diagram_type: class
    evidence:
      - "CaptureSession.h"
      - "BufferSlot.h"
      - "RequestQueue.h"
  request-lifecycle:
    kind: omm
    diagram_type: sequence
    evidence:
      - "CaptureSession.cpp"
      - "RequestQueue.cpp"
      - "BufferSlot.cpp"
  buffer-ownership:
    kind: omm
    diagram_type: state
    evidence:
      - "BufferSlot.h"
      - "BufferSlot.cpp"
pages:
  architecture.md:
    title: 요청 수용 조건
    blocks:
      - id: status
        kind: status
      - id: diagram
        kind: omm
        source: request-flow
        field: diagram
        confidence: code
      - id: overview
        kind: content
        based_on: [request-flow]
        confidence: code
        brief:
          reader: Camera HAL 코드를 읽고 수정하는 개발자
          answers:
            - canAccept는 어떤 조건에서 true 또는 false를 반환하는가
            - 조건의 상수는 어느 파일에서 정의하는가
          must_link: [canAccept, kBufferLimit]
          forbid:
            - 실제 기기의 Camera HAL 동작으로 설명하지 않습니다.
      - id: class-diagram
        kind: omm
        source: session-structure
        field: diagram
        confidence: code
      - id: sequence-diagram
        kind: omm
        source: request-lifecycle
        field: diagram
        confidence: code
      - id: state-diagram
        kind: omm
        source: buffer-ownership
        field: diagram
        confidence: code
      - id: state-description
        kind: omm
        source: buffer-ownership
        field: description
        confidence: code
